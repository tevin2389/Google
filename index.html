    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          var descriptor = {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = typeof val === 'function' ? val.bind(window) : val;
            },
            configurable: true,
            enumerable: true,
          };
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            }
          } catch (e2) {}
        } catch (err) {
          console.warn('Fetch descriptor initialization:', err);
        }
      })();
    </script>
